<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>命中池 · 安装</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; background:#0b0f14; color:#e5e7eb;
         font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; padding:24px; }
  .card { width:100%; max-width:380px; text-align:center; background:#111827; border:1px solid #1f2937;
          border-radius:20px; padding:28px 22px; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  img { width:96px; height:96px; border-radius:22px; box-shadow:0 10px 30px rgba(0,0,0,.4); }
  h1 { font-size:24px; margin:16px 0 4px; }
  .sub { color:#94a3b8; font-size:13px; margin-bottom:22px; }
  a.install { display:block; background:#f97316; color:#111827; text-decoration:none; font-weight:700;
              padding:14px; border-radius:14px; font-size:16px; }
  a.install:active { opacity:.8; }
  .hint { color:#64748b; font-size:12px; line-height:1.7; margin-top:18px; text-align:left; }
  .hint b { color:#94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <img src="icon-512.png" alt="命中池">
    <h1>命中池</h1>
    <div class="sub">iPhone · 本地版 · 51 MB</div>
    <a class="install" href="itms-services://?action=download-manifest&url=https://mac-mini.tailb562c6.ts.net/manifest.plist">安装命中池</a>
    <div class="hint">
      <b>用 Safari 打开本页</b>，点上面按钮。<br>
      首次安装后如果提示“未受信任的开发者”：<br>
      设置 → 通用 → VPN 与设备管理 → 信任。<br>
      免费开发签名 7 天有效，到期重装一次。
    </div>
  </div>
</body>
</html>
